<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Celik Minda Quest</title>
  <meta name="description" content="Permainan pengembaraan belajar untuk murid PASTI 5 & 6 tahun — BM, Arab, BI, Jawi, Matematik & Sains.">
  <meta name="theme-color" content="#ff7a59">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Celik Minda">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="world" aria-label="Kampung Celik Minda"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="me"><canvas id="meAv" width="48" height="48"></canvas><div><b id="meName"></b><small id="meStars"></small></div></div>
      <div class="hud-btns">
        <button data-h="rekod" title="Rekod">📊</button>
        <button data-h="settings" title="Tetapan">⚙️</button>
        <button data-h="install" class="install-btn hidden" title="Pasang">📲</button>
        <button data-h="title" title="Menu utama">🏠</button>
      </div>
    </div>
    <div class="hint-desktop">Jalan: ⬆⬇⬅➡ / WASD atau klik · Masuk / cakap: Enter</div>
    <div id="joy"><div class="knob"></div></div>
    <button id="actBtn" class="hidden"></button>
  </div>

  <div id="dialog"></div>
  <div id="overlay" class="overlay"></div>

  <noscript>Sila hidupkan JavaScript untuk bermain Celik Minda Quest.</noscript>
  <script src="js/data.js"></script>
  <script src="js/papers.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/world.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
